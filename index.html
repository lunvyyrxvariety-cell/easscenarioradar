<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EAS Scenario Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{margin:0;height:100%;background:#0b1020;font-family:system-ui}
#map{height:100%}
.controls{
position:absolute;z-index:1000;
top:10px;left:10px;
background:#111827;color:white;
padding:12px;border-radius:14px;
width:340px;
box-shadow:0 10px 30px rgba(0,0,0,.5)
}
select,input,button{
width:100%;margin-top:6px;
padding:8px;border-radius:8px;
border:none;font-weight:600
}
button{cursor:pointer}
</style>
</head>
<body>

<div id="map"></div>

<div class="controls">
<b>EAS Scenario Controls</b>

<select id="basemap">
<option value="osm">Light OSM</option>
<option value="dark">Dark</option>
<option value="sat">Satellite</option>
</select>

<select id="radarMode">
<option value="off">Radar Off</option>
<option value="on">Radar On</option>
<option value="animate">Radar Animate</option>
</select>

<select id="alertType">
<option value="TOR_WARN">Tornado Warning</option>
<option value="TOR_WATCH">Tornado Watch</option>
<option value="SVR_WARN">Severe Thunderstorm Warning</option>
<option value="SVR_WATCH">Severe Thunderstorm Watch</option>
<option value="WWA">Winter Weather Advisory</option>
<option value="WS_WATCH">Winter Storm Watch</option>
<option value="WS_WARN">Winter Storm Warning</option>
<option value="BLIZZ">Blizzard Warning</option>
<option value="FFW">Flash Flood Warning</option>
<option value="SMW">Special Marine Warning</option>
</select>

<input id="countyQuery" placeholder="North Fulton, GA"/>
<button onclick="loadCounty()">Search County Polygon</button>
<button onclick="issueAlert()">Issue Alert</button>
<button onclick="clearAlert()">Clear</button>
</div>

<script>
const map = L.map('map').setView([39.5,-98.35],4);

const baseLayers = {
osm:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
dark:L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'),
sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}')
};
baseLayers.osm.addTo(map);

document.getElementById("basemap").onchange=e=>{
Object.values(baseLayers).forEach(l=>map.removeLayer(l));
baseLayers[e.target.value].addTo(map);
};

let fakeRadar;
function drawFakeRadar(){
if(fakeRadar) map.removeLayer(fakeRadar);
fakeRadar=L.gridLayer({opacity:.5});
fakeRadar.createTile=(coords)=>{
const c=document.createElement("canvas");
c.width=256;c.height=256;
const ctx=c.getContext("2d");
for(let i=0;i<400;i++){
ctx.fillStyle=`rgba(${Math.random()*255},0,0,.3)`;
ctx.fillRect(Math.random()*256,Math.random()*256,4,4);
}
return c;
};
fakeRadar.addTo(map);
}
document.getElementById("radarMode").onchange=e=>{
if(e.target.value==="off"){if(fakeRadar)map.removeLayer(fakeRadar);}
else drawFakeRadar();
};

const ALERT_COLORS={
TOR_WARN:"#ff0000",
TOR_WATCH:"#ffff00",
SVR_WARN:"#ff7a00",
SVR_WATCH:"#ffb36b",
WWA:"#9bdcff",
WS_WATCH:"#00ffff",
WS_WARN:"#ffffff",
BLIZZ:"#0066ff",
FFW:"#1e4aa8",
SMW:"#001a66"
};

let alertLayer;

function issueAlert(){
if(!currentPolygon)return;
if(alertLayer)map.removeLayer(alertLayer);
alertLayer=L.polygon(currentPolygon,{
color:ALERT_COLORS[document.getElementById("alertType").value],
fillOpacity:.4,
weight:4
}).addTo(map);
}

function clearAlert(){
if(alertLayer)map.removeLayer(alertLayer);
}

let currentPolygon;

async function loadCounty(){
let input=document.getElementById("countyQuery").value.trim();
let parts=input.split(",");
if(parts.length<2){alert("Use format: County, State");return;}
let county=parts[0].replace(/north|south|east|west/ig,"").trim();
let state=parts[1].trim();

const query=`
[out:json][timeout:25];
area["boundary"="administrative"]["admin_level"="4"]["name"="${state}"]->.a;
relation["boundary"="administrative"]["admin_level"="6"]["name"~"${county}",i](area.a);
out geom;
`;

const res=await fetch("https://overpass-api.de/api/interpreter",{
method:"POST",
body:new URLSearchParams({data:query})
});
const data=await res.json();
if(!data.elements.length){alert("County not found");return;}

let coords=data.elements[0].members
.filter(m=>m.role==="outer"&&m.geometry)
.flatMap(m=>m.geometry.map(p=>[p.lat,p.lon]));

currentPolygon=coords.map(p=>L.latLng(p[0],p[1]));
map.fitBounds(L.polygon(currentPolygon).getBounds());
}
</script>

</body>
</html>
